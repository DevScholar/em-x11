<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>XCalc - EmX11</title>
  </head>
  <body>
    <script type="module">
      import { createEmX11 } from '../../src/index.js';

      const x11 = await createEmX11({ width: 800, height: 600 });

      const factory = (await import('/build/artifacts/xcalc/xcalc.js')).default;
      await factory({
        ...x11.moduleOverrides,
        thisProgram: 'xcalc',
        locateFile: (path) => `/build/artifacts/xcalc/${path}`,
      });
    </script>
  </body>
</html>
